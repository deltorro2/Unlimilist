[project]
name = "unlimilist"
dynamic = ["version"]
description = "Personal Kanban task manager"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "keyring>=25.7.0",
    "mammoth>=1.13.0",
    "pypdf>=6.21.1",
    "pyside6-essentials>=6.8",
    "pyyaml>=6.0",
]

[project.scripts]
unlimilist = "unlimilist.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pyinstaller>=6.11",
    "dmgbuild>=1.6.7",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/unlimilist/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
